name: Windows validation

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate-windows-builds:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Select version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $version = "0.1.$env:GITHUB_RUN_NUMBER"
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Generated build version is invalid: $version"
          }
          "INPUTRACK_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure release
        shell: pwsh
        run: >-
          cmake -S . -B build/windows-release-ci
          -G "Visual Studio 17 2022" -A x64
          "-DINPUTRACK_VERSION=$env:INPUTRACK_VERSION"
          -DINPUTRACK_BUILD_TESTS=ON
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build release
        shell: pwsh
        run: cmake --build build/windows-release-ci --config Release --parallel

      - name: Configure Microsoft Store release
        shell: pwsh
        run: >-
          cmake -S . -B build/windows-store-ci
          -G "Visual Studio 17 2022" -A x64
          "-DINPUTRACK_VERSION=$env:INPUTRACK_VERSION"
          -DINPUTRACK_BUILD_TESTS=ON
          -DINPUTRACK_STORE_BUILD=ON
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build Microsoft Store release
        shell: pwsh
        run: cmake --build build/windows-store-ci --config Release --parallel

      - name: Run release tests
        shell: pwsh
        run: ctest --test-dir build/windows-release-ci -C Release --output-on-failure

      - name: Run Microsoft Store tests
        shell: pwsh
        run: ctest --test-dir build/windows-store-ci -C Release --output-on-failure

      - name: Build direct installer
        if: github.ref_type == 'tag'
        shell: pwsh
        run: >-
          .\installer\windows\build-installer.ps1
          -Version $env:INPUTRACK_VERSION
          -BuildDirectory build/windows-release-ci
          -OutputDirectory out/windows

      - name: Build Microsoft Store MSIX
        shell: pwsh
        run: >-
          .\installer\windows\build-msix.ps1
          -Version $env:INPUTRACK_VERSION
          -BuildDirectory build/windows-store-ci
          -IdentityName "${{ vars.INPUTRACK_STORE_IDENTITY_NAME || 'InputRack.Dev' }}"
          -Publisher "${{ vars.INPUTRACK_STORE_PUBLISHER || 'CN=InputRack Development' }}"

      - name: Publish direct update release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            out/windows/InputRack-${{ env.INPUTRACK_VERSION }}-Windows-x64-Setup.exe
            out/windows/InputRack-${{ env.INPUTRACK_VERSION }}-Windows-x64-Setup.exe.sha256

      - name: Upload workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: InputRack-${{ env.INPUTRACK_VERSION }}-Store-test-package
          path: out/windows/InputRack-${{ env.INPUTRACK_VERSION }}-Windows-x64.msix
          if-no-files-found: error
